[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --cov=logmonitor
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
source = logmonitor
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    venv,
    build,
    dist
ignore = E203, W503
