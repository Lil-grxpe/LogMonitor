<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogMonitor - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🔒 LogMonitor</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3">
                    Bienvenue, {{ username }}
                </span>
                <a href="/logout" class="btn btn-sm btn-outline-light">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- KPI Row - Tous les éléments alignés sur une seule ligne -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card text-white h-100 shadow-sm"
                    style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);">
                    <div class="card-body">
                        <h5 class="card-title">Total Logs</h5>
                        <h2 id="total-logs" class="mb-0">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card text-white h-100 shadow-sm"
                    style="background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);">
                    <div class="card-body">
                        <h5 class="card-title">Total Alertes</h5>
                        <h2 id="total-alerts" class="mb-0">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card text-white h-100 shadow-sm"
                    style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);">
                    <div class="card-body">
                        <h5 class="card-title">Alertes Critiques</h5>
                        <h2 id="critical-alerts" class="mb-0">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card text-white h-100 shadow-sm"
                    style="background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);">
                    <div class="card-body">
                        <h5 class="card-title">État Système</h5>
                        <h2 class="mb-0">OK</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Génération de Rapports -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Génération de Rapports</h5>
                    </div>
                    <div class="card-body text-center">
                        <p class="text-muted small mb-3">Générer et télécharger des rapports d'analyse</p>
                        <div class="btn-group" role="group">
                            <button id="btn-report-pdf" class="btn btn-primary btn-lg"
                                onclick="generateReport('pdf')">Rapport PDF</button>
                            <button id="btn-report-csv" class="btn btn-outline-primary btn-lg"
                                onclick="generateReport('csv')">Rapport CSV</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <!-- Graphique des alertes par heure -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Alertes par Heure (24h)</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="alertsChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Répartition par sévérité -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Alertes par Severite</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="severityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <!-- Top IPs suspectes -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Top IPs Suspectes</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group" id="top-ips-list">
                            <li class="list-group-item">Chargement...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Import des scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>

</html>
